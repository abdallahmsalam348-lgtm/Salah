name: Build Salaty APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: unzip -o "$(ls *.zip | head -n 1)" -d source

      - name: Build Android APK
        working-directory: source/SalatyAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaty-APK
          path: source/SalatyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
